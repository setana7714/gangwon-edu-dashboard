<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밋앤잇 디자인 키트</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap');:root{--mint:#9CE6D3;--coral:#FF8368;--forest:#173B3F;--vanilla:#FFF7E8;--sage:#DDE8E3}*{box-sizing:border-box}body{margin:0;background:var(--vanilla);color:var(--forest);font-family:Arial,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:1080px;margin:auto;padding:48px 24px}.eyebrow{color:var(--coral);font-weight:800;letter-spacing:2px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}.hero h1{font-size:56px;line-height:1.05;margin:12px 0}.hero p{font-size:18px;line-height:1.6}.card{background:#fff;border:1px solid var(--sage);border-radius:28px;padding:24px;box-shadow:0 14px 30px #173b3f12}.dark{background:var(--forest);color:var(--vanilla)}section{margin-top:40px}.swatches{display:flex;gap:12px;flex-wrap:wrap}.swatch{width:150px;height:90px;border-radius:18px;padding:12px;display:flex;align-items:end;font-size:12px;font-weight:bold}.icons{width:100%;height:auto}.footer{margin-top:40px;padding:24px;border-radius:20px;background:var(--forest);color:var(--vanilla)}@media(max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:42px}}</style></head><body><main class="wrap"><div class="hero"><div><div class="eyebrow">MEET • EAT • WORK WELL</div><h1>밋앤잇<br>디자인 키트</h1><p>업무 장소를 고르는 시간을 가볍게 만드는, 다정하고 실무적인 로컬 큐레이션 브랜드.</p></div><div class="card"><img src="meetneat-logo.svg" alt="밋앤잇 로고" style="width:100%"></div></div><section><div class="card"><h2>시그니처 컬러</h2><div class="swatches"><div class="swatch" style="background:#9CE6D3">밋 민트<br>#9CE6D3</div><div class="swatch" style="background:#FF8368">잇 코랄<br>#FF8368</div><div class="swatch" style="background:#173B3F;color:#FFF7E8">딥 포레스트<br>#173B3F</div><div class="swatch" style="background:#FFF7E8;border:1px solid #DDE8E3">바닐라 크림<br>#FFF7E8</div></div></div></section><section><div class="card"><h2>카테고리 아이콘 & 추천 배지</h2><img class="icons" src="meetneat-icons.svg" alt="카테고리 아이콘"></div></section><section><div class="dark" style="border-radius:28px;padding:28px;background-image:url('meetneat-doodle-pattern.svg');background-size:cover"><h2 style="margin-top:0">중간 섹션 장식 띠</h2><p>필터 결과와 다음 행동 사이에 넣어 브랜드 호흡을 만들어주세요.</p></div></section><div class="footer">오늘의 업무, 장소 고르기부터 가볍게.</div></main></body></html>
